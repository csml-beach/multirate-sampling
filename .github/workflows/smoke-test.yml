name: Smoke Test

on:
  workflow_dispatch:

jobs:
  short-hlr:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run short HLR benchmark
        run: |
          python jax/benchmarks/hlr/benchmark_hlr.py \
            --group-mode longtail \
            --n-samples 4000 \
            --n-features 24 \
            --n-groups 300 \
            --feature-density 0.05 \
            --iters 40 \
            --save-every 20 \
            --particles 12 \
            --seeds 0

      - name: Verify smoke output
        run: |
          test -s metrics/hlr/longtail.csv
          python - <<'PY'
import csv
from pathlib import Path
p = Path("metrics/hlr/longtail.csv")
with p.open() as f:
    rows = list(csv.DictReader(f))
if not rows:
    raise SystemExit("smoke test failed: no rows written")
methods = {r["method"] for r in rows}
required = {
    "multirate_svgd",
    "adaptive_multirate_svgd",
    "vanilla_svgd",
    "strang_svgd",
    "sgld",
    "sghmc",
}
missing = sorted(required - methods)
if missing:
    raise SystemExit(f"smoke test failed: missing methods {missing}")
print(f"smoke test ok: {len(rows)} rows, methods={sorted(methods)}")
PY

      - name: Upload smoke metrics
        uses: actions/upload-artifact@v4
        with:
          name: smoke-metrics-hlr
          path: metrics/hlr/longtail.csv
